# 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch
# deps 的包进 package.json dependencies（workspace:*）：children 作为 dependencies
# 安装，DSH loader 从 profile 顶层解析 patch 行；严格（isolated）布局需在
# profile 配 hoist（nodeLinker: hoisted 或 public-hoist-pattern，见根 README）
# dsh-skins 的 patch 行只有 skin-center，汇总后展开为 web-ui-skin-center
# 所有子插件行 id 统一加 web-ui- 命名空间（生成器剥掉子包 ui- 前缀后加 web-ui-），
# 与独立包安装共存，不再触发 loader duplicate entry id
# self: 聚合包自身也作为插件加载（compat shim 的 host/client 已并入本包，
# 不再需要独立的 dsh-web-compat npm 包 —— npm 对新包名收费）
# 顺序注意：ui-web-ui-settings 排在最前（self 之后），先声明
# web-ui.plugin.item 子槽位，其余插件的设置卡再注入（slots.inject 声明感知，
# 但更早的声明让设置组在任何卡片之前就位，避免观感上的注册顺序歧义）。
# remote-web-ui 排在 pet 前，确保非 loopback 页面先安装配对门控的远程通道，
# 再由 pet 发起首次 /api/pet/* 请求，避免启动阶段命中 SDK 围栏。
patchFrom:
  - ../dsh-web-settings
  - ../dsh-plugin-manager
  - ../dsh-market
  - ../dsh-task-board
  # dsh-task-board-github 必须紧跟看板之后：它是看板的外部提供方扩展
  # （GitHub Issues 同步），聚合展开的行序就是浏览器半区与宿主半区的装载
  # 顺序，扩展向看板的提供方席位登记之前看板必须先就位。
  - ../dsh-task-board-github
  - ../dsh-git-graph
  - ../dsh-remote-web-ui
  # dsh-update 紧邻 remote-web-ui：两者共用侧栏 footer action 席位，
  # 自更新行跟在远程访问行之后，观感顺序稳定。
  - ../dsh-update
  - ../dsh-ssh
  - ../dsh-liangshen
  - ../dsh-skill-explorer
  - ../dsh-usage
  - ../dsh-session-archive
  - ../dsh-model-capabilities
  # dsh-i18n 语言包无宿主行为、无时序依赖，放列表末尾：注册 ru 语言与全部
  # 家族插件命名空间的 ru 字典（见 packages/dsh-i18n）。
  - ../dsh-i18n
self:
  - web-ui-compat
deps:
  - ../dsh-plugin-manager
  - ../dsh-market
  - ../dsh-task-board
  # 排在 ../dsh-task-board 之后：扩展依赖看板的提供方契约，deps 顺序与
  # patchFrom 顺序保持一致便于对照。
  - ../dsh-task-board-github
  - ../dsh-git-graph
  - ../dsh-remote-web-ui
  - ../dsh-update
  - ../dsh-ssh
  - ../dsh-liangshen
  - ../dsh-skill-explorer
  - ../dsh-usage
  - ../dsh-session-archive
  - ../dsh-model-capabilities
  - ../dsh-web-settings
  - ../dsh-i18n

# 独立仓库卫星（npm 外部行）：皮肤中心、宠物、社区插件索引迁出本单一仓库后由各自
# 仓库独立发版，这里只按 registry 版本内置。行 id 与 patchFrom 时期逐字一致
# （web-ui-* 命名空间不变），老 profile 无需迁移；remote-web-ui 仍排在 pet 之前
# （patchFrom 行整体先于外部行渲染）。
# 依赖版本由 packages/dsh-web-all/package.json 手写并随生成器保留。
# 代价：外部行不带聚合包的 fault-isolation shell，且客户端不再内联进本包 lib
# （改由卫星自带的 loader entry 挂载）。
# preset-center 排在 patchFrom 行之后：创意工坊卡片（本仓 dsh-market 行）先声明
# dsh-workshop.panel 子槽位，预设面板再注册进该槽位（见 dsh-presets 仓）。
# 家族行 id 覆盖（#1794）：子包独立安装行 id 与聚合家族行 id 解耦。
# dsh-plugin-manager 的独立行必须避开官方 @deepseek-ai/dsh-web-app 的
# ui-plugin-manager（loader 同 id 后来者胜且不报错，官方插件页行被静默丢弃，
# 侧栏「插件」入口随之消失）；派生规则会把新的独立行 id 一并改名，从而移动
# 已发布的聚合行 id 与家族子路径导出。覆盖把两者拆开：独立行改名，聚合行
# web-ui-plugin-manager 与子路径 plugin-manager 逐字不变，老 profile 无需迁移。
# 值必须在本聚合的 web-ui-* id 空间内，且必须指向本聚合真实挂载的行。
familyIds:
  ui-plugin-manager-update-check: web-ui-plugin-manager
rows:
  - {"id": "community-plugins", "name": "@linxin666/dsh-client-ui-community-plugins"}
  - {"id": "pet", "name": "@linxin666/dsh-pet"}
  - {"id": "preset-center", "name": "@linxin666/dsh-client-ui-preset-center"}
  - {"id": "skin-center", "name": "@linxin666/dsh-client-ui-skin-center"}

# 外部 npm 插件段：alpha 分支（2026-09-17 决策）不内置 dsh-better-sidebar。
# 该插件 0.19.1 的全部 @deepseek-ai/dsh-* peer 声明为 ^0.1.5-rc.1，按 semver
# 不覆盖本分支的 0.2.0-rc.2 cohort（预发布版本只匹配同 [major,minor,patch]
# 元的区间），因此 alpha 实验环境不再挂载这个右侧面板插件：聚合包不依赖它、
# profile 里也不出现它的行。需要右侧面板时按需安装
# （dsh plugin --profile <name> add dsh-better-sidebar@latest）。
# dev 分支保持内置 0.19.1，alpha 每次从 dev rebase 后需重新移除本段。
# 历史沿革（dev 侧仍适用）：2026-08-30 曾因 alpha.2 移除
# `@deepseek-ai/dsh-client-runtime` 面把本行与 dsh-archive-manager 一并排除；
# 2026-08-31 以 0.18.0-alpha.0 回归（inject 改用 dsh-client-modules）；
# 2026-09-04 随 rc.1 cohort 升至 0.18.0 正式版；2026-09-10 升至 0.19.0
# （inject 含 optional 的 dsh-client-ui-sidebar-right 面）；2026-09-11 升至
# 0.19.1。
# @mlgbnb/dsh-archive-manager 仍然排除：其 latest 1.0.7 仍 import 已移除面。
# 出厂默认关闭的可选行（2026-09-09 产品决策）：工具/探索类家族插件对新装用户
# 不加载（设置入口也不出现），在 设置 → 插件 → 插件管理 的聚合子行里逐个开启；
# 开启即写入用户层 disabled:false 覆盖（优先于本默认），停用回写 disabled:true。
# 锁定的核心行（compat/settings/plugin-manager）不可列入本清单。
# liangshen 不列入本清单（2026-10-10 决策）：梁神模式是新会话首页的常驻模式开关，
# 默认启动才让新装用户看到它；理由与取舍见 Agent Note
# .agents/notes/implemented/architecture/2026-10-10-liangshen-row-enabled-by-default.md。
inactive:
  - web-ui-ssh
  - web-ui-skill-explorer
# 归档设置入口（2026-09-15 原生优先决策）：dsh-session-archive 注册官方 section id
# archived-sessions 与 order 25 接管该入口，把「原生恢复列表 + 家族批量归档/删除/
# 自动策略」放在同一页。>=0.2.0-rc.2 的官方 dsh-web-app 不再挂载
# ui-settings-unarchive-sessions 行，所以这里没有 retire 目标：对不存在的行写
# disabled 覆盖只会让 loader 每次启动都报 "patch: entry ... not found"。加回 retire
# 目标前必须先在当前 cohort 上用 dsh --profile <name> --dump-config 确认该外部行存在。
# 兼容退役子插件导出：避免老用户 profile 残留旧条目时 Node.js 抛出 ERR_PACKAGE_PATH_NOT_EXPORTED
# 2026-09-23：describe-image 与 doctor 两个插件自家族移除，同样保留空壳导出。
tombstones:
  - desktop-launcher
  - dsh-perf
  - describe-image
  - doctor
  # 迁出为独立仓库的家族子路径：行已改为 npm 外部行（直挂真实包名），但旧 profile
  # 里记录的行名仍是 @linxin666/dsh-web-all/<family>。保留这些 shell 子路径导出
  # 让那些 profile 仍可 import，不抛 ERR_PACKAGE_PATH_NOT_EXPORTED。
  - pet
  - preset-center
  - skin-center
  - community-plugins